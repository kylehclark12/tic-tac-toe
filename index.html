<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Tic-Tac-Toe</title>
	<link href="style.css" rel="stylesheet" type="text/css"/>
	</head>
	<body>
		<br>
		<br>
		<button onclick="gamestart('pvp')" style="display: inline-block">
			2 Player
		</button>
		<button onclick="gamestart('pvc')" style="display: inline-block">
			1 Player
		</button>
		<button onclick="gamestart('cvc')" style="display: inline-block">
			Only Computers
		</button>
		<button onclick="restart()" style="display: inline-block">
			RESET
		</button>
		<div class="gamedisplay" id="gamedisplay">Pick a game</div>
		<div class="parent">
			<div id="g0" class="box" onclick="tictactoe(this)"> </div>
			<div id="g1" class="box" onclick="tictactoe(this)"> </div>
			<div id="g2" class="box" onclick="tictactoe(this)"> </div>
			<div id="g3" class="box" onclick="tictactoe(this)"> </div>
			<div id="g4" class="box" onclick="tictactoe(this)"> </div>
			<div id="g5" class="box" onclick="tictactoe(this)"> </div>
			<div id="g6" class="box" onclick="tictactoe(this)"> </div>
			<div id="g7" class="box" onclick="tictactoe(this)"> </div>
			<div id="g8" class="box" onclick="tictactoe(this)"> </div>
		</div>
    <script src="script.js"></script>
	</body>
</html>
